# SPRL-v3.1 recommended + tropical probe @ 100M-active.
#
# Identical to recommended_100m_pilot.yaml EXCEPT one tropical head is added.
# Used to test whether tropical attention helps without polluting the default
# recommended path. Pass criterion: improves synthetic DP/state-tracking tasks
# AND does not regress LM val loss by > 1.0% vs recommended_100m_pilot.

variant: recommended_plus_tropical_probe

d_model: 768
n_layers: 8
vocab_size: 256
max_seq_len_patches: 2048

patcher:
  enabled: true
  byte_lm_layers: 2
  byte_lm_dim: 192
  entropy_threshold: 1.5
  max_patch_bytes: 16
  byte_encoder_layers: 2
  byte_encoder_dim: 256
  patch_dim: 768

attention:
  pattern: alternating
  layer_types: [dsa_mla, sliding_window]
  mla:
    d_c_latent: 192
    d_qhead: 64
    d_rope_decoupled: 16
    n_heads: 12
  dsa: {enabled: true, indexer_type: hierarchical_hisa, top_k_blocks: 4, top_k_tokens_per_block: 64, block_size: 128, dense_until_seqlen: 2048}
  sliding: {window_size: 1024}
  tropical:
    enabled: true                          # <-- 1 head, ~8% of total
    fraction_of_heads: 0.0834              # ⌈12·0.0834⌉ = 1 tropical head
    num_tropical_heads_total: 1
    affects_training: true
    beta_warmup_min: 1.0
    beta_warmup_max: 16.0
    warmup_fraction: 0.05
    never_exceed_fraction: 0.125

dram:
  enabled: true
  cell_type: recurrent_middle_block
  prefix_layers: 2
  recurrent_cell_layers: 4
  suffix_layers: 2
  routing_granularity: per_block
  k_iterations_default: 2
  k_max: 4
  use_depth_attention: false
  rg_flow: {enabled: false}
  router:
    enabled: true
    k_max: 4
    k_target: 2
    training_mode: straight_through_soft_k
    source: scout_head_only

kalman:
  enabled: true
  rank: 8
  eps_diag: 1.0e-4
  chunk_size: 128
  mode: passive_probe
  fusion_gate_init: -3.0
  can_control_router: false

moe:
  enabled: true
  num_routed_experts: 8
  num_shared_experts: 1
  active_per_token: 2
  expert_dim: 1024
  aux_loss_weight: 0.001

mtp: {enabled: true, depth: 2, loss_weight: 0.3}
precision: {forward_default: bf16, backward_default: bf16, master_weight_dtype: bf16}

compute:
  flop_convention: 6N_per_token
  architecture_overhead_factor: 1.3
  count_recurrence_in_active_params: true

training:
  seed: 1234
  batch_size: 32
  seq_len_patches: 1024
  lr: 6.0e-3
  warmup_steps: 1000
  total_steps: 30000
  grad_clip: 1.0
  count_recurrence_in_active_flops: true
  distill_enabled: false
  distill_mode: teacher_token_kl
  distill_kl_direction: teacher_forward_kl
  distill_store_indices: true
  distill_store_logits: true
  distill_store_teacher_logsumexp: true
  nca_pretrain_enabled: true
