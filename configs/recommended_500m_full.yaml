# Recommended full pretraining @ ~500M-active params (~2B total).
# Realistic Stage-3 target: ~50B tokens / ≤ 1 week of single-5080 BF16.
# Local training only by default. Tropical/RG-flow OFF; Kalman as passive probe
# until kill criterion A passes (then router can be promoted).

d_model: 1024
n_layers: 16
vocab_size: 256
max_seq_len_patches: 8192

patcher:
  enabled: true
  byte_lm_layers: 2
  byte_lm_dim: 256
  entropy_threshold: 1.5
  max_patch_bytes: 16
  byte_encoder_layers: 4
  byte_encoder_dim: 384
  patch_dim: 1024

attention:
  pattern: alternating
  layer_types: [dsa_mla, sliding_window]
  mla: {d_c_latent: 384, d_qhead: 96, d_rope_decoupled: 32, n_heads: 16}
  dsa: {enabled: true, indexer_type: hierarchical_hisa, top_k_blocks: 16, top_k_tokens_per_block: 64, block_size: 128, dense_until_seqlen: 1024}
  sliding: {window_size: 1024}
  tropical: {enabled: false}     # OFF in recommended

dram:
  enabled: true
  k_iterations_default: 2
  k_max: 4
  use_depth_attention: true
  rg_flow: {enabled: false}      # diagnostic only via T_b_norm log
  router:
    enabled: false                # passive Kalman; promote after kill A passes
    k_max: 4
    k_target: 2

kalman:
  enabled: true                   # passive probe
  rank: 8
  eps_diag: 1.0e-4
  chunk_size: 256

moe:
  enabled: true
  num_routed_experts: 16          # smaller than original-bets full to fit budget
  num_shared_experts: 1
  active_per_token: 2
  expert_dim: 1536
  expert_grouping: heterogeneous
  aux_loss_weight: 0.001

mtp: {enabled: true, depth: 2, loss_weight: 0.3}

precision:
  forward_default: bf16
  backward_default: bf16
  master_weight_dtype: bf16
  optimizer_type: adamw_8bit
  use_galore: true
  galore_rank: 128
  galore_targets: [moe_expert_w1, moe_expert_w2, moe_expert_w3]

training:
  seed: 1234
  batch_size: 16
  seq_len_patches: 1024
  lr: 3.0e-3
  weight_decay: 0.1
  warmup_steps: 2000
  total_steps: 100000             # ~50B tokens at batch 16, seq 1024
  grad_clip: 1.0
  count_recurrence_in_active_flops: true
  distill_enabled: false          # opt-in: requires sequence_level mode under BLT
  distill_mode: teacher_token_kl
  active_selection_enabled: false # opt-in (requires distill_enabled=true)
  iterative_redistill_enabled: false
  nca_pretrain_enabled: true
  curriculum_enabled: true
  curriculum_freeze_until_tokens: 5_000_000_000
