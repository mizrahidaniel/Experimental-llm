# Kill experiment B: Bet B — Tropical (max-plus) attention heads.
#
# Pass criteria (per spec §6.2):
#   1. GSM8K @ 0.5B tokens vs softmax-only: +3% (with chain-of-thought)
#   2. MMLU @ 0.5B tokens vs softmax-only: within ±0.5%
#   3. Argmax position concentration < 0.95 (head not degenerate)
#
# Compare against pilot_100m_bf16.yaml. ~4 hours on 5080 BF16.

d_model: 512
n_layers: 12
vocab_size: 256
max_seq_len_patches: 1024

patcher: {enabled: true, byte_lm_layers: 2, byte_lm_dim: 192, max_patch_bytes: 16, byte_encoder_dim: 256}

attention:
  pattern: alternating
  layer_types: [dsa_mla, sliding_window]
  mla: {d_c_latent: 256, d_qhead: 64, d_rope_decoupled: 16, n_heads: 8}
  dsa: {enabled: true, indexer_type: hierarchical_hisa, top_k_blocks: 8, top_k_tokens_per_block: 64, block_size: 128, dense_until_seqlen: 1024}
  sliding: {window_size: 1024}
  tropical:
    enabled: true                 # <-- Bet B on
    fraction_of_heads: 0.25       # 1 of 4 heads max-plus
    beta_warmup_min: 1.0
    beta_warmup_max: 32.0
    warmup_fraction: 0.05

dram:
  k_iterations_default: 3
  k_max: 6
  use_depth_attention: true
  rg_flow: {enabled: false}
  router: {enabled: false}

kalman: {enabled: false}

moe:
  enabled: true
  num_routed_experts: 8
  num_shared_experts: 1
  active_per_token: 2
  expert_dim: 1024
  aux_loss_weight: 0.001

mtp: {enabled: true, depth: 2, loss_weight: 0.3}
precision: {forward_default: bf16, backward_default: bf16, master_weight_dtype: bf16}

training:
  seed: 1234
  batch_size: 32
  seq_len_patches: 512
  lr: 6.0e-3
  warmup_steps: 1000
  total_steps: 30000
  grad_clip: 1.0
  distill_enabled: false
