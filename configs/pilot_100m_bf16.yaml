# SPRL-v2 pilot @ 100M-active params (Stage 1 baseline).
#
# Kill experiments at this scale should run in ~4 hours on a 5080 in BF16, ~1B
# FineWeb-Edu tokens. Use as the no-novel-bets baseline for comparing against
# the kill_exp_{A,B,C} configs.

d_model: 512
n_layers: 12                  # 6 DSA-MLA + 6 sliding, alternating
vocab_size: 256
max_seq_len_patches: 1024

patcher:
  enabled: true
  byte_lm_layers: 2
  byte_lm_dim: 192            # smaller than 200M pilot's 256
  entropy_threshold: 1.5
  max_patch_bytes: 16
  byte_encoder_layers: 2
  byte_encoder_dim: 256
  patch_dim: 512

attention:
  pattern: alternating
  layer_types: [dsa_mla, sliding_window]
  mla:
    d_c_latent: 256
    d_qhead: 64
    d_rope_decoupled: 16
    n_heads: 8
  dsa:
    enabled: true
    indexer_type: hierarchical_hisa
    top_k_blocks: 8
    top_k_tokens_per_block: 64
    block_size: 128
    dense_until_seqlen: 1024     # InfLLM-V2 switchable: dense at this scale
  sliding:
    window_size: 1024
  tropical:
    enabled: false               # Bet B off in baseline

dram:
  enabled: true
  weight_tied: true
  k_iterations_default: 3        # smaller than 200M pilot's 4
  k_max: 6
  use_depth_attention: true
  rg_flow:
    enabled: false               # Bet C off in baseline
  router:
    enabled: false                # entropy router fallback (no Bet A)
    k_max: 6
    k_target: 3

kalman:
  enabled: false                  # Bet A off in baseline
  rank: 8

moe:
  enabled: true
  num_routed_experts: 8
  num_shared_experts: 1
  active_per_token: 2
  expert_dim: 1024
  expert_grouping: heterogeneous
  aux_loss_weight: 0.001

mtp:
  enabled: true
  depth: 2
  loss_weight: 0.3

precision:
  forward_default: bf16          # Tier 1 — start here, promote later
  backward_default: bf16
  master_weight_dtype: bf16
  optimizer_type: adamw
  use_galore: false

training:
  seed: 1234
  batch_size: 32
  seq_len_patches: 512
  lr: 6.0e-3                      # μP-scaled from 200M pilot
  weight_decay: 0.1
  warmup_steps: 1000
  total_steps: 30000              # ~1B tokens at batch 32, seq 512, ~4h on 5080 BF16
  grad_clip: 1.0
  distill_enabled: false          # local training only (no teacher)
  nca_pretrain_enabled: true
  curriculum_enabled: false
