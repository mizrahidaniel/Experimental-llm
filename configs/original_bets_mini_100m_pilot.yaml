# SPRL-v3.1 original-bets mini pilot @ ~100M-active.
#
# Research-ablation variant. Keeps original SPRL-v2 mechanisms (KalmanMemory
# active, tropical heads at ≤ 1/8, RG-flow as diagnostic) at mini scale.
# NOT expected to be the strongest benchmark model; the goal is to falsify
# or validate the original mechanisms.

variant: original_bets_mini_v3_1

d_model: 768
n_layers: 8                   # 2 prefix + 4 cell + 2 suffix
vocab_size: 256
max_seq_len_patches: 2048

patcher:
  enabled: true
  byte_lm_layers: 2
  byte_lm_dim: 256
  entropy_threshold: 1.5
  max_patch_bytes: 16
  byte_encoder_layers: 2
  byte_encoder_dim: 384
  patch_dim: 768

attention:
  pattern: alternating
  layer_types: [dsa_mla, sliding_window]
  mla: {d_c_latent: 384, d_qhead: 64, d_rope_decoupled: 16, n_heads: 12}
  dsa: {enabled: true, indexer_type: hierarchical_hisa, top_k_blocks: 8, top_k_tokens_per_block: 64, block_size: 128, dense_until_seqlen: 2048}
  sliding: {window_size: 1024}
  tropical:
    enabled: true
    fraction_of_heads: 0.0834              # 1 head of 12 (≈ 8%)
    num_tropical_heads_total: 1
    affects_training: true
    beta_warmup_min: 1.0
    beta_warmup_max: 16.0
    warmup_fraction: 0.05
    never_exceed_fraction: 0.125            # ≤ 1/8 of heads at mini scale

dram:
  enabled: true
  cell_type: recurrent_middle_block
  prefix_layers: 2
  recurrent_cell_layers: 4
  suffix_layers: 2
  routing_granularity: per_block
  k_iterations_default: 2
  k_max: 4
  use_depth_attention: false
  rg_flow:
    enabled: false                         # diagnostic-only; promote after stable depth dynamics
    rank_T_b: 32
    init_method: marchenko_pastur
    alpha_target: 1.0e-3
  router:
    enabled: true
    k_max: 4
    k_target: 2
    training_mode: straight_through_soft_k
    source: kalman_plus_scout_if_authority_else_scout_only

kalman:
  enabled: true                            # active (more aggressive than recommended)
  rank: 8
  eps_diag: 1.0e-4
  chunk_size: 128
  mode: active_if_kill_passes
  fusion_gate_init: -2.0                   # sigmoid(-2) ≈ 0.12; higher initial influence
  can_control_router: false                # promoted after Bet A kill

moe:
  enabled: true
  num_routed_experts: 8
  num_shared_experts: 1
  active_per_token: 2
  expert_dim: 1024
  expert_grouping: heterogeneous
  aux_loss_weight: 0.001

mtp: {enabled: true, depth: 2, loss_weight: 0.3}
precision: {forward_default: bf16, backward_default: bf16, master_weight_dtype: bf16}

compute:
  flop_convention: 6N_per_token
  architecture_overhead_factor: 1.3
  count_recurrence_in_active_params: true

training:
  seed: 1234
  batch_size: 32
  seq_len_patches: 1024
  lr: 6.0e-3
  warmup_steps: 1000
  total_steps: 30000
  grad_clip: 1.0
  count_recurrence_in_active_flops: true
  distill_enabled: false
  distill_mode: auxiliary_teacher_token_head    # BLT vocab ≠ teacher BPE
  distill_kl_direction: teacher_forward_kl
  distill_teacher_base: llama_3_1_8b
  distill_teacher_instruct: llama_3_1_8b_instruct
  distill_store_indices: true
  distill_store_logits: true
  distill_store_teacher_logsumexp: true
  nca_pretrain_enabled: true
