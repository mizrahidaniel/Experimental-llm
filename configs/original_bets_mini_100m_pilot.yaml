# Original-bets mini pilot @ ~100M-active params.
#
# Research-ablation variant: keeps the v2 mechanisms (KalmanMemory active,
# tropical heads, RG-flow as diagnostic) at mini scale. NOT expected to be
# the strongest benchmark model — this is for falsifying mechanisms.
#
# Key shrinks vs the original v2:
#   - tropical heads: 1 of 8 (12.5%), not 1 of 4 (25%) — too expensive at mini.
#   - RG-flow: diagnostic-only (loss disabled); enable loss via config only
#     after the depth-dynamics power-law diagnostic stays stable across
#     checkpoints.
#   - distillation: still teacher_token_kl by default but tokenizer alignment
#     is enforced — under BLT, must switch to sequence_level (validation
#     errors out otherwise). Default config has distillation OFF.

d_model: 768
n_layers: 12
vocab_size: 256
max_seq_len_patches: 2048

patcher:
  enabled: true
  byte_lm_layers: 2
  byte_lm_dim: 256
  entropy_threshold: 1.5
  max_patch_bytes: 16
  byte_encoder_layers: 2
  byte_encoder_dim: 384
  patch_dim: 768

attention:
  pattern: alternating
  layer_types: [dsa_mla, sliding_window]
  mla: {d_c_latent: 384, d_qhead: 64, d_rope_decoupled: 16, n_heads: 12}
  dsa: {enabled: true, indexer_type: hierarchical_hisa, top_k_blocks: 8, top_k_tokens_per_block: 64, block_size: 128, dense_until_seqlen: 1024}
  sliding: {window_size: 1024}
  tropical:
    enabled: true                 # 1-of-8 fraction — see comment above
    fraction_of_heads: 0.0834     # ⌈12·0.0834⌉ = 1 head
    beta_warmup_min: 1.0
    beta_warmup_max: 16.0
    warmup_fraction: 0.05

dram:
  enabled: true
  k_iterations_default: 2
  k_max: 4
  use_depth_attention: true
  rg_flow:
    enabled: false                # diagnostic-only; promote after stable depth dynamics
    rank_T_b: 32
    init_method: marchenko_pastur
    alpha_target: 1.0e-3
  router:
    enabled: true                 # active inference router fed by Kalman uncertainty
    k_max: 4
    k_target: 2

kalman:
  enabled: true                   # active (drives router)
  rank: 8
  eps_diag: 1.0e-4
  chunk_size: 128

moe:
  enabled: true
  num_routed_experts: 8
  num_shared_experts: 1
  active_per_token: 2
  expert_dim: 1024
  expert_grouping: heterogeneous
  aux_loss_weight: 0.001

mtp: {enabled: true, depth: 2, loss_weight: 0.3}
precision: {forward_default: bf16, backward_default: bf16, master_weight_dtype: bf16}

training:
  seed: 1234
  batch_size: 32
  seq_len_patches: 1024
  lr: 6.0e-3
  warmup_steps: 1000
  total_steps: 30000
  grad_clip: 1.0
  count_recurrence_in_active_flops: true
  distill_enabled: false
  distill_mode: teacher_token_kl
  active_selection_enabled: false
  iterative_redistill_enabled: false
  nca_pretrain_enabled: true
