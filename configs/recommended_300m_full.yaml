# SPRL-v3.1 recommended full pretrain @ ~250-350M effective active params.
#
# Honest target tier: ~30B tokens / ≤ 1 week on 5080 BF16 (110 TFLOPS sustained,
# 6N × 1.3 overhead). FP8 stretch tier (50B tokens) requires kernel maturity;
# NVFP4 (100B) is aspirational.

variant: recommended

d_model: 768
n_layers: 8                   # 2 prefix + 4 cell + 2 suffix
vocab_size: 256               # BLT default; switch to teacher tokenizer + larger vocab
                              # to enable teacher_token_kl distillation.
max_seq_len_patches: 8192

patcher:
  enabled: true
  byte_lm_layers: 2
  byte_lm_dim: 256
  entropy_threshold: 1.5
  max_patch_bytes: 16
  byte_encoder_layers: 4
  byte_encoder_dim: 384
  patch_dim: 768

attention:
  pattern: alternating
  layer_types: [dsa_mla, sliding_window]
  mla:
    d_c_latent: 256
    d_qhead: 64
    d_rope_decoupled: 16
    n_heads: 12
  dsa: {enabled: true, indexer_type: hierarchical_hisa, top_k_blocks: 8, top_k_tokens_per_block: 64, block_size: 128, dense_until_seqlen: 4096}
  sliding: {window_size: 1024}
  tropical: {enabled: false}

dram:
  enabled: true
  cell_type: recurrent_middle_block
  prefix_layers: 2
  recurrent_cell_layers: 4
  suffix_layers: 2
  routing_granularity: per_block
  k_iterations_default: 2          # fallback target_mean_k; promote to 3 if budget allows
  k_max: 4                          # fallback; promote to 6 if budget allows
  use_depth_attention: false
  rg_flow: {enabled: false}
  router:
    enabled: true
    k_max: 4
    k_target: 2
    training_mode: straight_through_soft_k
    source: kalman_plus_scout_if_authority_else_scout_only

kalman:
  enabled: true
  rank: 8
  eps_diag: 1.0e-4
  chunk_size: 256
  mode: passive_probe_then_active_if_passes
  fusion_gate_init: -3.0
  can_control_router: false        # promote after Bet A kill passes

moe:
  enabled: true
  num_routed_experts: 16
  num_shared_experts: 1
  active_per_token: 2
  expert_dim: 1536
  expert_grouping: heterogeneous
  aux_loss_weight: 0.001

mtp: {enabled: true, depth: 2, loss_weight: 0.3}

precision:
  forward_default: bf16
  backward_default: bf16
  master_weight_dtype: bf16
  optimizer_type: adamw_8bit
  use_galore: true
  galore_rank: 128
  galore_targets: [moe_expert_w1, moe_expert_w2, moe_expert_w3]

compute:
  flop_convention: 6N_per_token
  architecture_overhead_factor: 1.3
  count_recurrence_in_active_params: true
  target_effective_active_params: [250_000_000, 350_000_000]

training:
  seed: 1234
  batch_size: 16
  seq_len_patches: 1024
  lr: 3.0e-3
  weight_decay: 0.1
  warmup_steps: 2000
  total_steps: 60000             # ~30B tokens at batch 16, seq 1024
  grad_clip: 1.0
  count_recurrence_in_active_flops: true
  distill_enabled: false
  distill_mode: teacher_token_kl
  distill_kl_direction: teacher_forward_kl
  distill_teacher_base: llama_3_1_8b
  distill_teacher_instruct: llama_3_1_8b_instruct
  distill_store_indices: true
  distill_store_logits: true
  distill_store_teacher_logsumexp: true
  active_selection_enabled: false
  iterative_redistill_enabled: false
  nca_pretrain_enabled: true
  curriculum_enabled: true
  curriculum_freeze_until_tokens: 5_000_000_000
