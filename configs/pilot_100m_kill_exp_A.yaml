# Kill experiment A: Bet A — Kalman info-form belief memory.
#
# Pass criteria (per spec §6.2):
#   1. Spearman ρ(log|Λ_t|, oracle teacher surprise) ≥ 0.5
#   2. Validation loss within ±0.2% of a Mamba-3 baseline at matched FLOPs
#
# Run alongside pilot_100m_bf16.yaml (the baseline) on a precomputed teacher
# surprise stream (Llama-3-8B or Qwen-2.5-7B forward pass over the validation
# subset). Decision in ~4 hours of 5080 BF16 wall-clock.

d_model: 512
n_layers: 12
vocab_size: 256
max_seq_len_patches: 1024

patcher:
  enabled: true
  byte_lm_layers: 2
  byte_lm_dim: 192
  entropy_threshold: 1.5
  max_patch_bytes: 16
  byte_encoder_layers: 2
  byte_encoder_dim: 256

attention:
  pattern: alternating
  layer_types: [dsa_mla, sliding_window]
  mla: {d_c_latent: 256, d_qhead: 64, d_rope_decoupled: 16, n_heads: 8}
  dsa: {enabled: true, indexer_type: hierarchical_hisa, top_k_blocks: 8, top_k_tokens_per_block: 64, block_size: 128, dense_until_seqlen: 1024}
  sliding: {window_size: 1024}
  tropical: {enabled: false}

dram:
  enabled: true
  weight_tied: true
  k_iterations_default: 3
  k_max: 6
  use_depth_attention: true
  rg_flow: {enabled: false}
  router:
    enabled: true                 # active-inference router consumes Bet A's log_det
    k_max: 6
    k_target: 3

kalman:
  enabled: true                   # <-- Bet A on
  rank: 8
  eps_diag: 1.0e-4
  chunk_size: 128

moe:
  enabled: true
  num_routed_experts: 8
  num_shared_experts: 1
  active_per_token: 2
  expert_dim: 1024
  aux_loss_weight: 0.001

mtp: {enabled: true, depth: 2, loss_weight: 0.3}
precision: {forward_default: bf16, backward_default: bf16, master_weight_dtype: bf16}

training:
  seed: 1234
  batch_size: 32
  seq_len_patches: 512
  lr: 6.0e-3
  warmup_steps: 1000
  total_steps: 30000              # ~4 hours on 5080 BF16
  grad_clip: 1.0
  distill_enabled: false
